spring:
  main:
    web-application-type: none
    banner-mode: off
  datasource:
    driver-class-name: org.sqlite.JDBC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    locations: classpath:db/migration

logging:
  level:
    root: INFO

# Application identity shown in the signature, About dialog and licence screen.
# The version comes from pom.xml at build time (the only place it is written).
app:
  version: "@project.version@"
  developer: "Muhammet Akduman"
  copyright-year: 2026
