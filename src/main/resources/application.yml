spring:
  main:
    web-application-type: none
    banner-mode: off
  datasource:
    driver-class-name: org.sqlite.JDBC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    locations: classpath:db/migration

logging:
  level:
    root: INFO

# Application identity shown in the window title, signature, About dialog,
# licence screen and PDF footers. Name, version and description come from
# pom.xml at build time (the only place they are written).
app:
  name: "@project.name@"
  version: "@project.version@"
  description: "@project.description@"
  developer: "Muhammet Akduman"
  copyright-year: 2026
